name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: extension/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install extension dependencies
        run: yarn --cwd extension install --frozen-lockfile

      - name: Test extension protocol
        run: yarn --cwd extension test

      - name: Build Chrome extension
        run: ./scripts/build-chrome.sh

      - name: Build Firefox extension
        run: ./scripts/build-firefox.sh

      - name: Test companion
        run: |
          xcodebuild test \
            -project companion/Float.xcodeproj \
            -scheme Float \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/float-tests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Debug companion
        run: |
          xcodebuild build \
            -project companion/Float.xcodeproj \
            -scheme Float \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/float-debug" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned universal Release companion
        run: |
          xcodebuild build \
            -project companion/Float.xcodeproj \
            -scheme Float \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/float-release" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: float-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/chrome-extension
            build/firefox-extension
            ${{ runner.temp }}/float-debug/Build/Products/Debug/Float.app
            ${{ runner.temp }}/float-release/Build/Products/Release/Float.app
